<form (ngSubmit)="isRegister ? registerUser() : loginUser()">

  @if (isRegister) {
  <div class="form-group">
    <label>Full name</label>
    <input type="text" name="fullName" [(ngModel)]="fullName" placeholder="Enter full name">
  </div>
  }

  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" [(ngModel)]="email" placeholder="Enter email">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" name="password" [(ngModel)]="password" placeholder="Enter password">
  </div>

  @if (isRegister) {
  <div class="form-group">
    <label>Confirm password</label>
    <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm password">
  </div>
  }

  <button type="submit" [disabled]="isLoading">
    {{ isLoading ? 'Please wait...' : (isRegister ? 'Register' : 'Login') }}
  </button>

  @if (!isRegister) {
  <button type="button" class="google-btn" (click)="googleLogin()">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-logo">
    <span>Continue with Google</span>
  </button>
  }

  @if (errorMessage) {
  <div class="error-message">{{ errorMessage }}</div>
  }
  @if (successMessage) {
  <div class="success-message">{{ successMessage }}</div>
  }

  <a class="toggle" (click)="toggleMode()">
    {{ isRegister ? 'Already have an account? Login' : 'New user? Register' }}
  </a>

</form>
